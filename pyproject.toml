[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autolabel"
version = "0.1.0"
description = "Auto-labeling of small/thin surface defects from very few pixel masks, with measurable label quality"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "opencv-python-headless",
    "pillow",
    "torch>=2.0",
    "timm>=0.9",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "pandas"]

[project.scripts]
autolabel = "autolabel.cli:main"

[tool.setuptools.packages.find]
include = ["autolabel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
